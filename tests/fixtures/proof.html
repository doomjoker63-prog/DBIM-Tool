<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proof fixture</title>
<style>
  /* The three things that broke the old screenshots: smooth scrolling, a sticky header, and content that only appears when scrolled to. */
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: Arial, sans-serif; }
  header { position: sticky; top: 0; height: 80px; background: #fff; border-bottom: 1px solid #bbb; z-index: 5; display: flex; align-items: center; padding: 0 40px; }
  .spacer { height: 1800px; background: linear-gradient(#fff, #eef1ff); }
  .reveal { opacity: 0; transform: translateY(40px); transition: opacity .6s, transform .6s; }
  .reveal.in { opacity: 1; transform: none; }
  #deep { height: 140px; margin: 0 60px; background: #12ab34; color: #fff; font-size: 28px; line-height: 140px; text-align: center; }
  #tile { width: 220px; height: 100px; background: #DCEBF7; margin: 30px 60px; }
  footer { background: #04263F; color: #fff; padding: 50px 60px 70px; }
  footer a { color: #fff; margin-right: 24px; }
</style>
</head>
<body>
<header><b>Proof fixture site</b></header>
<div class="spacer"></div>
<div id="deep" class="reveal">Deep element</div>
<div class="spacer"></div>
<div id="tile" class="reveal"></div>
<div class="spacer"></div>
<footer><p>Site footer</p><a href="#">Website Policies</a><a href="#">Help</a><a href="#">Contact Us</a></footer>
<script>
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); }), { threshold: 0.2 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
</body>
</html>
